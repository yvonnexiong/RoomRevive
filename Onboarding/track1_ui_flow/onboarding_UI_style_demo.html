<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomRevive — Onboarding Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 /* RoomRevive palette */
 --surf-base:#B5BCD0;   --surf-light:#D4D9E5;  --surf-deep:#7C85A0;
 --ink:#3A4055;         --ink-2:#6B7388;       --card-inner:#C7CDDD;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Alan Sans',system-ui,sans-serif;color:var(--ink);
background:var(--surf-base);display:flex;align-items:center;justify-content:center;padding:26px}
.wrap{width:100%;max-width:480px}
/* progress */
.prog{display:flex;gap:6px;margin:0 6px 14px}
.prog span{height:4px;flex:1;border-radius:3px;background:rgba(124,133,160,.35)}
.prog span.on{background:var(--surf-deep)}
/* banner (outer surface) */
.banner{text-align:center;border-radius:14px;padding:20px 22px;margin-bottom:20px;
 background:linear-gradient(180deg,var(--surf-light),var(--surf-base));
 border:1px solid rgba(255,255,255,.55);
 box-shadow:0 10px 30px rgba(58,64,85,.16),inset 0 1px 0 rgba(255,255,255,.6)}
.banner h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.banner p{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
/* options */
.page{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;border:none;background:none;font:inherit;cursor:pointer;padding:0;
 transition:transform .14s,box-shadow .14s;border-radius:12px}
.opt:hover{transform:translateY(-3px)}
/* image card — caption = card-inner (frame-in-frame) */
.card{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 8px 22px rgba(58,64,85,.20)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.card .cap{padding:11px 12px;text-align:left;background:var(--card-inner)}
.card .lab{display:block;font-size:14px;font-weight:700;color:var(--ink);line-height:1.2}
.card .sub{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.card.sel{box-shadow:0 0 0 3px var(--surf-deep),0 10px 26px rgba(124,133,160,.55)}
.card.sel .cap{background:var(--surf-deep)}
.card.sel .lab{color:#fff}
.card.sel .sub{color:rgba(255,255,255,.82)}
/* text chip = card-inner */
.row{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-radius:12px;
 background:var(--card-inner);border:1px solid rgba(255,255,255,.5);text-align:left;
 box-shadow:0 4px 14px rgba(58,64,85,.12)}
.row .lab{font-size:15px;font-weight:600;color:var(--ink)}
.row .sub{font-size:12.5px;color:var(--ink-2)}
.row.sel{background:var(--surf-deep);border-color:transparent}
.row.sel .lab{color:#fff}.row.sel .sub{color:rgba(255,255,255,.82)}
.opt.off{opacity:.34;pointer-events:none}
/* nav */
.nav{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;border:none;border-radius:10px;padding:14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .12s}
.btn.back{flex:0 0 auto;padding:14px 20px;background:var(--surf-light);color:var(--ink)}
.btn.next{background:var(--surf-deep);color:#fff;box-shadow:0 8px 20px rgba(124,133,160,.5)}
.btn.next:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn:not(:disabled):active{transform:scale(.98)}
/* loading / processing */
.load{margin:0 auto}
.dots{display:inline-flex;gap:4px;margin-left:5px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--surf-deep);display:inline-block;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;margin-bottom:9px;border-radius:10px;
 background:var(--card-inner);border:1px solid rgba(255,255,255,.5);opacity:0;transform:translateY(8px);
 animation:fadeUp .45s ease forwards}
.lrow .lk{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;width:96px;flex:0 0 auto}
.lrow .lv{font-size:14.5px;font-weight:600;color:var(--ink);flex:1}
.lrow .ck{width:22px;height:22px;border-radius:50%;background:var(--surf-deep);color:#fff;display:flex;
 align-items:center;justify-content:center;font-size:12px;opacity:0;transform:scale(.4);animation:pop .4s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.bar{height:5px;border-radius:4px;background:rgba(124,133,160,.3);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:var(--surf-deep);border-radius:4px;animation:fill 2.9s ease forwards}
@keyframes fill{to{width:100%}}
/* kitchen-ready changes card */
.ready{margin:0 auto}
.changes{background:var(--card-inner);border:1px solid rgba(255,255,255,.55);border-radius:14px;
 padding:18px 18px 16px;box-shadow:0 10px 26px rgba(58,64,85,.18)}
.c-eye{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:12px}
.crow:first-of-type{border-top:none}
.tnote{text-align:center;font-size:16px;font-weight:600;color:var(--ink);margin-top:22px;
 display:flex;align-items:center;justify-content:center;gap:2px}
.c-cnt{font-size:18px;font-weight:700;color:var(--ink);margin:2px 0 12px}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;
 border-top:1px solid rgba(58,64,85,.10);opacity:0;animation:fadeUp .4s ease forwards}
.crow .c-cat{font-size:13px;color:var(--ink-2)}
.crow .c-val{font-size:13.5px;font-weight:600;color:var(--ink);text-align:right}
.est{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;padding-top:14px;border-top:1px solid rgba(58,64,85,.16)}
.e-lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:2px}
.e-val{font-size:20px;font-weight:700;color:var(--ink);line-height:1}
.e-note{font-size:11px;color:var(--ink-2)}

const PAGES = [
 {key:'style', q:'Which style do you prefer?', sub:"Pick the look that feels like you.", type:'cards', opts:[
   {lab:'Clean & Uncluttered', sub:'Modern', v:'modern'},
   {lab:'Bold & Dramatic', sub:'Designer', v:'designer'},
   {lab:'Warm & Cozy', sub:'Cottage', v:'cottage style'},
   {lab:'Calm & Natural', sub:'Scandinavian', v:'natural & scandinavian'}]},
 {key:'tone', q:'Which colours feel most like home?', sub:"Choose the colours you're drawn to.", type:'cards', opts:[
   {lab:'Light & Airy', v:'light'},
   {lab:'Dark & Moody', v:'dark'},
   {lab:'Warm Wood Tones', v:'wood'},
   {lab:'Colourful & Playful', v:'bold'}]},
 {key:'household', q:'How many are you usually cooking for?', sub:"So we size everything to fit.", type:'list', opts:[
   {lab:'1\u20132 people', v:'compact'},
   {lab:'3\u20134 people', v:'standard'},
   {lab:'5+ people', v:'host'}]},
 {key:'budget', q:'How much would you like to invest?', sub:"We'll find the right range for you.", type:'list', opts:[
   {lab:'Essential', sub:'Affordable', v:'Essential'},
   {lab:'Signature', sub:'Mid-range', v:'Signature'},
   {lab:'Premium', sub:'High-end', v:'Premium'},
   {lab:'Show All', sub:'Explore everything', v:'any'}]}
];
const DISABLED_TONE = {'natural & scandinavian':['dark','bold']};
const A = {style:null,tone:null,household:null,budget:null};
let page = 0;
function renderProg(){const p=document.getElementById('prog');
 if(page>=4){p.style.display='none';return;} p.style.display='flex'; p.innerHTML='';
 for(let i=0;i<4;i++){const s=document.createElement('span'); if(i<=page)s.className='on'; p.appendChild(s);}}
function setBanner(t,s){document.getElementById('bTitle').textContent=t;document.getElementById('bSub').textContent=s;}
function render(){
  clearTimeout(window._t1);clearTimeout(window._t2);
  renderProg();
  const view=document.getElementById('view'), nav=document.getElementById('nav');
  if(page===4){renderReview(view,nav);return;}
  if(page===5){renderReady(view,nav);return;}
  const P=PAGES[page]; setBanner(P.q,P.sub);
  const dis=DISABLED_TONE[A.style]||[];
  let html='';
  P.opts.forEach(o=>{
    const sel=A[P.key]===o.v?' sel':'';
    const off=(P.key==='tone'&&dis.includes(o.v))?' off':'';
    if(P.type==='cards'){
      html+='<button class="opt'+off+'" data-v="'+o.v+'"><div class="card'+sel+'"><img src="'+IMG[o.v]+'" alt="">'
          +'<div class="cap"><span class="lab">'+o.lab+'</span>'+(o.sub?'<span class="sub">'+o.sub+'</span>':'')+'</div></div></button>';
    } else {
      html+='<button class="opt'+off+'" data-v="'+o.v+'"><div class="row'+sel+'"><span class="lab">'+o.lab+'</span>'+(o.sub?'<span class="sub">'+o.sub+'</span>':'')+'</div></button>';
    }
  });
  view.innerHTML='<div class="page '+(P.type==='cards'?'cards':'list')+'">'+html+'</div>';
  view.querySelectorAll('.opt:not(.off)').forEach(b=>b.addEventListener('click',()=>{
    A[P.key]=b.dataset.v;
    if(P.key==='style'){const d=DISABLED_TONE[A.style]||[]; if(d.includes(A.tone))A.tone=null;}
    render();
  }));
  nav.innerHTML=(page>0?'<button class="btn back" id="back">Back</button>':'')
    +'<button class="btn next" id="next"'+(A[P.key]?'':' disabled')+'>'+(page===3?'See my kitchen':'Next')+'</button>';
  if(page>0)document.getElementById('back').onclick=()=>{page--;render();};
  document.getElementById('next').onclick=()=>{if(A[PAGES[page].key]){page++;render();}};
}
function labelFor(k,v){const o=PAGES.find(p=>p.key===k).opts.find(o=>o.v===v);return o?o.lab:v;}
function renderReview(view,nav){
  setBanner('Personalizing your dream kitchen','');
  document.getElementById('bSub').innerHTML='Matching your choices to the perfect pieces <span class="dots"><i></i><i></i><i></i></span>';
  const order=[['style','Style'],['tone','Palette'],['household','Cooking for'],['budget','Investment']];
  const rows=order.map((o,i)=>
    '<div class="lrow" style="animation-delay:'+(i*0.5)+'s"><span class="lk">'+o[1]+'</span>'
    +'<span class="lv">'+labelFor(o[0],A[o[0]])+'</span>'
    +'<span class="ck" style="animation-delay:'+(i*0.5+0.32)+'s">\u2713</span></div>').join('');
  view.innerHTML='<div class="page load">'+rows+'<div class="bar"><i></i></div></div>';
  nav.innerHTML='';
  // settle on the captured preferences, then auto-advance to the kitchen-ready page
  window._t1=setTimeout(()=>{ if(page!==4)return;
    document.getElementById('bTitle').textContent='Your preferences';
    document.getElementById('bSub').textContent='Got it \u2014 finding your kitchen';
  }, 2700);
  window._t2=setTimeout(()=>{ if(page!==4)return; page=5; render(); }, 3800);
}
// representative top picks per category — the real values come from the Selection Core (topPick per category)
const RECOMMENDED=[
  ['Kitchen','TOUCH 337'],
  ['Fridge','KDN 4174 E Active'],
  ['Cooktop','CS 7612 FL'],
  ['Hood','DA 1260'],
  ['Microwave','M 2224 SC'],
  ['Dishwasher','G 5540 SCU SL Active'],
  ['Coffee machine','CM 5310 Silence']
];
function renderReady(view,nav){
  setBanner('Your kitchen is ready','Here\u2019s what we\u2019ll bring into your room');
  const rows=RECOMMENDED.map((it,i)=>
    '<div class="crow" style="animation-delay:'+(i*0.07)+'s"><span class="c-cat">'+it[0]+'</span><span class="c-val">'+it[1]+'</span></div>').join('');
  view.innerHTML='<div class="page ready"><div class="changes">'
    +'<div class="c-eye">In this room</div>'
    +rows
    +'</div>'
    +'<div class="tnote">Transforming your kitchen <span class="dots"><i></i><i></i><i></i></span></div>'
    +'</div>';
  nav.innerHTML='';
}
render();
</script>
