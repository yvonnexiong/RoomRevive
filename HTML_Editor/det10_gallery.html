<!DOCTYPE html><html><head><meta charset="utf-8"><title>Dishwasher 10-angle detection</title>
<style>body{margin:0;background:#14161a;color:#e9e7e1;font-family:system-ui,sans-serif}
h1{font-size:16px;padding:14px 16px;margin:0;border-bottom:1px solid #2e333d}
.note{color:#9097a3;font-size:12px;padding:8px 16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:16px}

.cell img{width:100%;display:block}
.cell div{font-family:ui-monospace,monospace;font-size:11px;color:#9097a3;padding:6px 8px}
</style></head><body>
<h1>Dishwasher — option 2: orbit the object, 10 shallow angles · OWLv2 result</h1>
<div class="note">Floaters hidden. OWLv2 returned 0 dishwasher detections on all 10 (no boxes drawn) — the panel-front dishwasher blends with the white cabinetry and lacks kitchen context from these close angles.</div>
<div class="grid" id="g"></div>
<script>const g=document.getElementById('g');for(let i=0;i<10;i++){const c=document.createElement('div');c.className='cell';
c.innerHTML='<img src="det10/a'+i+'.png"><div>angle '+i+'</div>';g.appendChild(c);}</script>
</body></html>
