<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomRevive — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --base:#B5BCD0; --surf-light:#D4D9E5; --surf-deep:#7C85A0; --card-inner:#C7CDDD;
  --ink:#3A4055; --ink-2:#6B7388;
  --teal:#7BA8C4; --amber:#E6A560; --peach:#E8B894;
  --glass:rgba(213,217,229,0.35); --r:8px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Alan Sans',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 120% at 20% 0%,#D4D9E5 0%,#B5BCD0 55%,#A6AEC4 100%);
  min-height:100vh;padding:28px 18px 60px}
.wrap{max-width:1080px;margin:0 auto}
header{margin-bottom:22px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo b{color:var(--teal)}
.sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.45);border-radius:var(--r);padding:18px 18px 20px}
.q{margin-bottom:16px}
.q:last-child{margin-bottom:4px}
.q .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;font-weight:600}
.q h3{margin:0 0 10px;font-size:15.5px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid rgba(58,64,85,.18);background:rgba(255,255,255,.30);color:var(--ink);
  padding:8px 13px;border-radius:var(--r);font:inherit;font-size:13px;cursor:pointer;
  transition:transform .12s ease,background .12s ease,border-color .12s ease}
.opt:hover{background:rgba(255,255,255,.55);transform:translateY(-1px)}
.opt[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 4px 14px rgba(123,168,196,.4)}
.opt .hint{display:block;font-size:10.5px;color:var(--ink-2);margin-top:1px}
.opt[aria-pressed="true"] .hint{color:rgba(255,255,255,.85)}
.reset{margin-top:6px;border:none;background:none;color:var(--ink-2);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
.opts:has(.opt.card){display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt.card{flex-direction:column;align-items:stretch;padding:0;overflow:hidden;text-align:left;background:rgba(255,255,255,.30)}
.opt.card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--card-inner)}
.opt.card .ct{padding:8px 10px;display:block;font-size:13px;line-height:1.25}
.opt.card .ct .hint{display:block}
.opt.card:hover{transform:translateY(-2px)}
.opt.card[aria-pressed="true"]{background:rgba(255,255,255,.30);border-color:var(--teal);box-shadow:0 0 0 2px var(--teal),0 8px 18px rgba(123,168,196,.4)}
.opt.card[aria-pressed="true"] .ct{background:var(--teal);color:#fff}
.opt.card[aria-pressed="true"] .ct .hint{color:rgba(255,255,255,.85)}
.profile{background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(199,205,221,.30));
  border:1px solid rgba(255,255,255,.55);border-radius:var(--r);padding:16px 16px 15px;margin-bottom:16px}
.p-eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);font-weight:700;margin-bottom:4px}
.p-title{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.p-tag{margin:3px 0 14px;font-size:13px;color:var(--ink-2)}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
@media(max-width:480px){.p-grid{grid-template-columns:1fr}}
.p-field{display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35}
.p-lab{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.p-tags{display:flex;flex-wrap:wrap;gap:5px}
.p-tags span{background:rgba(123,168,196,.18);border:1px solid rgba(123,168,196,.35);color:var(--ink);
  font-size:11px;padding:2px 8px;border-radius:6px}
.slot .why{font-size:11px;color:var(--ink-2);line-height:1.35;margin:4px 0 6px}
.kpi{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.kpi .big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi .arrow{color:var(--ink-2);font-size:20px}
.kpi .cap{color:var(--ink-2);font-size:13px}
.reflect{font-size:13px;color:var(--ink);background:rgba(255,255,255,.30);border-left:3px solid var(--amber);
  border-radius:6px;padding:9px 12px;margin:12px 0 16px;line-height:1.45}
.shortlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{font-size:11.5px;background:rgba(255,255,255,.45);border:1px solid rgba(58,64,85,.12);
  border-radius:6px;padding:4px 9px;color:var(--ink)}
.chip.more{color:var(--ink-2);background:none;border:none}
.slot-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 9px;font-weight:600}
.suite{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:480px){.suite{grid-template-columns:1fr}}
.slot{background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.5);border-radius:var(--r);padding:10px 11px}
.slot .cat{font-size:10.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ocount{text-transform:none;letter-spacing:0;font-size:10.5px;color:var(--teal);background:rgba(123,168,196,.16);border:1px solid rgba(123,168,196,.3);border-radius:5px;padding:1px 6px;font-weight:600;white-space:nowrap}
.ocount.relaxed{color:var(--amber);background:rgba(230,165,96,.16);border-color:rgba(230,165,96,.35)}
.slot .pick{font-size:13px;font-weight:600;margin:2px 0 6px;line-height:1.25;min-height:16px}
.dots{display:flex;gap:3px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(58,64,85,.18)}
.dot.on{background:var(--amber)}
.mlabel{font-size:10px;color:var(--ink-2);margin-left:6px}
.foot{margin-top:16px;font-size:11px;color:var(--ink-2);line-height:1.5}
.foot b{color:var(--ink)}
.empty{color:var(--ink-2);font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Room<b>Revive</b></div>
    <div class="sub">Onboarding — four taps to your kitchen suite (live catalogue)</div>
  </header>
  <div class="grid">
    <section class="panel" id="qpanel"></section>
    <section class="panel" id="rpanel"><p class="empty">Loading the catalogue…</p></section>
  </div>
</div>
<script>
let ITEMS=[];
const P=it=>it.product||{};
function imgUrl(p){if(!p)return"";const v=String(p).replace(/\\/g,"/");const i=v.toLowerCase().indexOf("3d-models/");return i<0?"":"/models/"+v.slice(i+10).split("/").map(encodeURIComponent).join("/");}
const kImg=it=>imgUrl(it.image||P(it).heroImage||P(it).afterImage||P(it).frontImage);

const styleOf=it=>{const k=(P(it).kitchenType||"").toLowerCase();
  if(k.includes("cottage"))return"cottage"; if(k.includes("scand")||k.includes("natural"))return"scandi";
  if(k.includes("design"))return"designer"; if(k.includes("modern"))return"modern"; return null;};
const paletteOf=it=>{const s=[P(it).color,P(it).front].filter(Boolean).join(" ").toLowerCase();
  if(/oak|walnut|wood|sierra|havana|bergamo|montreal|timber/.test(s))return"wood";
  if(/aqua|olive|jade|reed green|rust|coral|blackberry|rose gold/.test(s))return"pop";
  if(/obsidian|black|graphite|slate|anthracite|concrete|charcoal/.test(s))return"dark";
  if(/white|alpine|ivory|cream|lotus|pearl/.test(s))return"light";
  if(/grey|gray|stone|satin|taupe|macchiato|coffee|sand|beige/.test(s))return"neutral"; return null;};
const tierOf=it=>{const p=P(it),cat=it.category,sub=(p.subtitle||"").toUpperCase();
  if(cat==="Hoods"||cat==="Cooktops"){if(/DIAMOND|PLATINUM/.test(sub))return"premium";if(/GOLD/.test(sub))return"balanced";if(/SILVER/.test(sub))return"essential";return null;}
  if(cat==="Fridges"){const f=(p.features||[]).join(" ");return /PerfectFresh/.test(f)?"premium":/DailyFresh/.test(f)?"balanced":"essential";}
  if(cat==="Kitchens"){const s=[p.front,p.color].filter(Boolean).join(" ").toLowerCase();return /lacquer|gloss|honed|paint|premium|concrete/.test(s)?"premium":/reproduction|laminate|texture/.test(s)?"essential":"balanced";}
  if(cat==="CoffeeMachines"){const f=(p.features||[]).join(" ");return /milk|onetouch|cappuccino/i.test(f)?"premium":"balanced";}
  return null;};
const sizeOf=it=>{const p=P(it);if(it.category==="Fridges"&&p.fridgeCapacity!=null){const c=p.fridgeCapacity;return c<240?"1-2":c<=300?"2-4":"4+";}
  if(it.category==="Dishwashers"&&p.placeSettings!=null){const n=p.placeSettings;return n<=9?"1-2":n<=13?"2-4":"4+";}return null;};
const af=it=>P(it).antiFingerprint===true||/clean ?steel/i.test(P(it).color||"");
const harmony=(a,b)=>!b||a===b||a==="neutral"||b==="neutral";

const S={style:null,palette:null,household:null,kids:false,investment:null};
const LBL={modern:"Modern",designer:"Designer",cottage:"Cottage",scandi:"Scandinavian",light:"Light & airy",dark:"Dark & dramatic",wood:"Warm wood",pop:"Pop of colour","1-2":"Just me / a pair","2-4":"A family","4+":"A full house",essential:"Essential",balanced:"Balanced",premium:"Premium"};
const INTENT={modern:"Fast & Focused",designer:"Host & Gather",cottage:"Calm & Unwind",scandi:"Calm & Unwind"};
const TAGLINE={modern:"Efficient, structured, clutter-free.",designer:"Warm, social, made for company.",cottage:"Quiet, cosy, end-of-day calm.",scandi:"Soft, natural, light-filled calm."};
const TIERN={essential:1,balanced:2,premium:3};

const best=(l,f)=>l.slice().sort((a,b)=>f(b)-f(a))[0];
function refine(list,filters,soft){
  const full=list.filter(it=>filters.every(f=>f(it)));
  if(full.length)return{count:full.length,relaxed:false,pick:best(full,soft)};
  for(let k=filters.length-1;k>=0;k--){const s=list.filter(it=>filters.slice(0,k).every(f=>f(it)));if(s.length)return{count:s.length,relaxed:true,pick:best(s,soft)};}
  return{count:list.length,relaxed:true,pick:best(list,soft)};
}
const byCat=c=>ITEMS.filter(i=>i.category===c);

function results(){
  const kit=refine(byCat("Kitchens"),
    [it=>!S.style||styleOf(it)===S.style, it=>!S.palette||paletteOf(it)===S.palette, it=>!S.kids||af(it), it=>!S.investment||tierOf(it)===S.investment],
    it=>(styleOf(it)===S.style?3:0)+(paletteOf(it)===S.palette?2:0)+(S.kids&&af(it)?1.5:0)+(tierOf(it)===S.investment?1:0));
  const allKit=byCat("Kitchens").map(it=>({it,s:(styleOf(it)===S.style?3:0)+(paletteOf(it)===S.palette?2:0)+(S.kids&&af(it)?1.5:0)+(tierOf(it)===S.investment?1:0)})).sort((a,b)=>b.s-a.s).map(x=>x.it);
  const fr=refine(byCat("Fridges"),
    [it=>!S.household||sizeOf(it)===S.household, it=>!S.kids||af(it), it=>harmony(paletteOf(it),S.palette), it=>!S.investment||tierOf(it)===S.investment],
    it=>((sizeOf(it)===S.household)?2:0)+(S.kids&&af(it)?1.5:0)+(harmony(paletteOf(it),S.palette)?1:0)+(tierOf(it)===S.investment?1:0));
  const hd=refine(byCat("Hoods"),[it=>!S.investment||tierOf(it)===S.investment, it=>harmony(paletteOf(it),S.palette)],it=>((tierOf(it)===S.investment)?2:0)+(harmony(paletteOf(it),S.palette)?1:0));
  const ck=refine(byCat("Cooktops"),[it=>!S.investment||tierOf(it)===S.investment],it=>(tierOf(it)===S.investment?1:0)+Math.random()*0.001);
  const co=refine(byCat("CoffeeMachines"),[it=>harmony(paletteOf(it),S.palette), it=>!S.investment||tierOf(it)===S.investment],it=>(harmony(paletteOf(it),S.palette)?2:0)+(tierOf(it)===S.investment?1:0)+Math.random()*0.001);
  const dw=refine(byCat("Dishwashers"),[it=>!S.household||sizeOf(it)===S.household, it=>!S.investment||tierOf(it)===S.investment],it=>((sizeOf(it)===S.household)?2:0)+(tierOf(it)===S.investment?1:0));
  return {kit,allKit,fr,hd,ck,co,dw};
}

function slotHtml(cat,icon,r){
  if(!r.pick)return"";
  const t=tierOf(r.pick),tn=TIERN[t]||0;
  const dots=[1,2,3].map(i=>'<span class="dot'+(i<=tn?' on':'')+'"></span>').join("");
  const badge='<span class="ocount'+(r.relaxed?' relaxed':'')+'">'+(r.relaxed?'closest':r.count+' option'+(r.count>1?'s':''))+'</span>';
  const nm=P(r.pick).name||r.pick.name;
  return '<div class="slot"><div class="cat"><span>'+cat+'</span>'+badge+'</div><div class="pick">'+nm+'</div><div class="dots">'+dots+'<span class="mlabel">'+(t||"")+'</span></div></div>';
}

function render(){
  const any=S.style||S.palette||S.household||S.investment||S.kids;
  const r=document.getElementById("rpanel");
  if(!any){r.innerHTML='<p class="empty">Answer a few questions on the left — your kitchen profile and matched suite appear here, narrowed live from the real catalogue.</p>';return;}
  const R=results();
  const kCount=R.kit.count, kTotal=byCat("Kitchens").length;
  const intent=S.style?INTENT[S.style]:"Your kitchen";
  const tagline=S.style?TAGLINE[S.style]:"Tell us a little about how you live.";
  const field=(lab,val)=>'<div class="p-field"><span class="p-lab">'+lab+'</span><div class="p-tags">'+(val?'<span>'+val+'</span>':'<span style="opacity:.5">any</span>')+'</div></div>';
  const palWord={light:"bright and airy",dark:"deep and dramatic",wood:"warm and natural",pop:"full of character"}[S.palette]||"your way";
  const shortlist=R.allKit.slice(0,5).map(it=>'<span class="chip">'+(P(it).name||it.name)+'</span>').join("")+(kCount>5?'<span class="chip more">+'+(kCount-5)+' more</span>':"");
  r.innerHTML=
    '<div class="profile">'+
      '<div class="p-eyebrow">Your kitchen profile</div>'+
      '<h2 class="p-title">'+intent+'</h2>'+
      '<p class="p-tag">'+tagline+'</p>'+
      '<div class="p-grid">'+
        field("Style",S.style?LBL[S.style]:null)+
        field("Palette",S.palette?LBL[S.palette]:null)+
        field("Household",(S.household?LBL[S.household]:null)+(S.kids?' · kids':''))+
        field("Investment",S.investment?LBL[S.investment]:null)+
      '</div>'+
    '</div>'+
    '<div class="kpi"><span class="big">'+kCount+'</span><span class="arrow">←</span><span class="cap">of '+kTotal+' kitchens are right for you</span></div>'+
    '<div class="reflect">Same room, same layout — dressed '+palWord+', and built around '+(S.household?LBL[S.household].toLowerCase():'how you live')+(S.kids?', kid-proof':'')+'.</div>'+
    '<div class="slot-h">Top kitchens</div><div class="shortlist">'+shortlist+'</div>'+
    '<div class="slot-h">Your matched suite</div>'+
    '<div class="suite">'+
      slotHtml("Fridge","",R.fr)+slotHtml("Extractor","",R.hd)+slotHtml("Cooktop","",R.ck)+slotHtml("Coffee","",R.co)+slotHtml("Dishwasher","",R.dw)+
    '</div>'+
    '<div class="foot"><b>Live catalogue.</b> Counts come straight from your real Nobilia + Miele data. Secondary appliances are matched (top pick + how many fit), never interviewed — and it never returns empty (relax-and-rank falls back to the closest match).</div>';
}

function buildQuestions(){
  const repImg=pred=>{const it=byCat("Kitchens").find(i=>pred(i)&&kImg(i));return it?kImg(it):"";};
  const styleOpts=[["modern","Clean & uncluttered","Modern"],["designer","Bold & striking","Designer"],["cottage","Warm & lived-in","Cottage"],["scandi","Calm, natural woods","Scandinavian"]];
  const palOpts=[["light","Light & airy"],["dark","Dark & dramatic"],["wood","Warm wood"],["pop","A pop of colour"]];
  const hhOpts=[["1-2","Just me / a pair"],["2-4","A family"],["4+","A full house"]];
  const invOpts=[["essential","Smart & simple","Essential"],["balanced","Balanced","Signature"],["premium","Go premium","Premium"]];
  const card=(dim,v,label,hint,img)=>'<button class="opt card" data-dim="'+dim+'" data-v="'+v+'" aria-pressed="false"><img class="thumb" alt="" src="'+img+'"><span class="ct">'+label+(hint?'<span class="hint">'+hint+'</span>':'')+'</span></button>';
  const pill=(dim,v,label,hint)=>'<button class="opt" data-dim="'+dim+'" data-v="'+v+'" aria-pressed="false">'+label+(hint?'<span class="hint">'+hint+'</span>':'')+'</button>';
  document.getElementById("qpanel").innerHTML=
    '<div class="q"><div class="lab">01 · Style</div><h3>Which style is you?</h3><div class="opts">'+
      styleOpts.map(o=>card("style",o[0],o[1],o[2],repImg(i=>styleOf(i)===o[0]))).join("")+'</div></div>'+
    '<div class="q"><div class="lab">02 · Palette</div><h3>Which palette feels like home?</h3><div class="opts">'+
      palOpts.map(o=>card("palette",o[0],o[1],"",repImg(i=>paletteOf(i)===o[0]))).join("")+'</div></div>'+
    '<div class="q"><div class="lab">03 · Household</div><h3>Who lives here?</h3><div class="opts">'+
      hhOpts.map(o=>pill("household",o[0],o[1])).join("")+pill("kids","yes","Kids at home","easy-clean")+'</div></div>'+
    '<div class="q"><div class="lab">04 · Investment</div><h3>Where do you want to invest?</h3><div class="opts">'+
      invOpts.map(o=>pill("investment",o[0],o[1],o[2])).join("")+'</div></div>'+
    '<button class="reset" id="reset">Reset answers</button>';
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const dim=b.dataset.dim,v=b.dataset.v,box=b.parentElement;
    if(dim==="kids"){S.kids=!S.kids;b.setAttribute("aria-pressed",String(S.kids));}
    else{const on=S[dim]===v;S[dim]=on?null:v;
      box.querySelectorAll('[data-dim="'+dim+'"]').forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed",String(!on));}
    render();
  }));
  document.getElementById("reset").addEventListener("click",()=>{Object.keys(S).forEach(k=>S[k]=k==="kids"?false:null);document.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false"));render();});
}

(async()=>{
  for(const u of ["/api/catalog","catalog.json","../catalog.json"]){
    try{const res=await fetch(u);if(res.ok){const d=await res.json();if(d&&d.items){ITEMS=d.items;break;}}}catch(e){}
  }
  if(!ITEMS.length){document.getElementById("rpanel").innerHTML='<p class="empty">Could not load the catalogue. Open this via the admin server: http://localhost:4173/onboarding.html</p>';return;}
  buildQuestions();render();
})();
</script>
</body>
</html>
