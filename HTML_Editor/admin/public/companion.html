<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomRevive · Web Companion</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#B7BED1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1F2433;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 60px}
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .logo{width:46px;height:46px;border-radius:13px;background:#3A4055;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;font-weight:600;letter-spacing:-1px}
  .top h1{font-size:22px;font-weight:600;letter-spacing:-0.5px}
  .top .sub{font:500 11px/1 ui-monospace,monospace;color:#545B70;letter-spacing:3px;margin-top:3px}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .bar input{flex:1;min-width:200px;border:none;border-radius:10px;padding:11px 14px;font:inherit;background:rgba(255,255,255,0.65);color:#1F2433;outline:none}
  .bar input::placeholder{color:#6b7185}
  .count{font-size:13px;color:#3A4055}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
  .card{background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(31,36,51,0.08)}
  .prev{aspect-ratio:4/3;background:radial-gradient(circle at 50% 35%,#eef0f4,#dfe3ec);position:relative}
  .prev model-viewer{width:100%;height:100%;--poster-color:transparent}
  .prev .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa0b0;font-size:13px}
  .body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
  .brand{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#545B70}
  .name{font-size:19px;font-weight:600;letter-spacing:-0.01em;margin-top:2px}
  .emo{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.4;color:#3A4055;margin:10px 0 0}
  .rate{display:flex;align-items:center;gap:6px;font-size:13px;color:#3A4055;margin-top:8px}
  .rate .stars{color:#E8A21C;letter-spacing:1px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
  .chip{font-size:12px;padding:5px 10px;border-radius:8px;background:#EEF0F4;color:#545B70}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:16px}
  .price .lbl{font-size:10px;letter-spacing:0.1em;color:#808797}
  .price .val{font-size:18px;font-weight:600}
  .fav{display:inline-flex;align-items:center;gap:7px;font:500 14px/1 inherit;padding:10px 16px;border-radius:11px;border:1px solid #d7dae3;background:#fff;color:#1F2433;cursor:pointer}
  .fav:active{transform:scale(.97)}
  .fav.on{background:#FBEBD3;border-color:#FBEBD3;color:#8a5a12}
  .heart{font-size:16px;line-height:1}
  /* splash */
  #splash{position:fixed;inset:0;background:#B7BED1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:50;transition:opacity .4s}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .logo{width:96px;height:96px;border-radius:24px;font-size:60px}
  #splash .t{font-size:18px;font-weight:600;color:#1F2433}
  #splash .s{font:500 12px/1 ui-monospace,monospace;color:#545B70;letter-spacing:3px}
</style>
</head>
<body>
  <div id="splash">
    <div class="logo">R</div>
    <div>
      <div class="t" style="text-align:center">RoomRevive</div>
      <div class="s" style="text-align:center;margin-top:6px">WEB COMPANION</div>
    </div>
  </div>

  <div class="wrap">
    <header class="top">
      <div class="logo">R</div>
      <div>
        <h1>RoomRevive</h1>
        <div class="sub">WEB COMPANION</div>
      </div>
    </header>

    <div class="bar">
      <input id="q" type="search" placeholder="Search fridges by name or colour…">
      <span class="count" id="count"></span>
    </div>

    <div class="grid" id="grid"></div>
  </div>

<script>
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');
let fridges = [];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function stars(r){
  if(r==null) return '';
  const full=Math.floor(r), half=(r-full)>=0.25 && (r-full)<0.75, total=Math.round(r-full>=0.75?full+1:full);
  let s='';
  for(let i=0;i<5;i++){ s += i<full ? '★' : (i===full&&half ? '⯨' : '☆'); }
  return s;
}

function chips(p){
  const out=[];
  if(p.fridgeCapacity!=null) out.push(p.fridgeCapacity+' L'+(p.freezerCapacity!=null?' + '+p.freezerCapacity+' L frys':''));
  if(p.annualEnergy!=null) out.push(p.annualEnergy+' kWh/yr');
  if(p.noise!=null) out.push(p.noise+' dB');
  if(p.energyClass) out.push('Class '+p.energyClass);
  return out.map(c=>`<span class="chip">${esc(c)}</span>`).join('');
}

function card(it){
  const p=it.product||{};
  const src=it.file?`/models/${encodeURIComponent(it.category)}/${encodeURIComponent(it.file)}`:'';
  const prev = src
    ? `<div class="prev"><model-viewer src="${src}" camera-controls auto-rotate disable-zoom interaction-prompt="none" camera-orbit="35deg 78deg auto" loading="lazy"></model-viewer></div>`
    : `<div class="prev"><span class="ph">no model</span></div>`;
  const price = p.price!=null ? `<div class="price"><div class="lbl">FROM</div><div class="val">${p.currency==='EUR'?'€':''}${p.price}${p.currency!=='EUR'?' '+esc(p.currency||''):''}</div></div>` : `<div class="price"><div class="lbl">&nbsp;</div><div class="val" style="color:#aab">—</div></div>`;
  const rate = p.rating!=null ? `<div class="rate"><span class="stars">${stars(p.rating)}</span> ${p.rating.toFixed(1)}${p.reviewCount?` <span style="color:#808797">(${p.reviewCount})</span>`:''}</div>` : '';
  const el=document.createElement('div');
  el.className='card';
  el.innerHTML = `
    ${prev}
    <div class="body">
      <div class="brand">${esc(p.brand||'Miele')}${p.color?' · '+esc(p.color):''}</div>
      <div class="name">${esc(p.name||it.name)}</div>
      ${p.emotionalLine?`<p class="emo">${esc(p.emotionalLine)}</p>`:''}
      ${rate}
      <div class="chips">${chips(p)}</div>
      <div class="foot">
        ${price}
        <button class="fav"><span class="heart">♡</span><span class="lab">Favorite</span></button>
      </div>
    </div>`;
  const fav=el.querySelector('.fav');
  fav.onclick=()=>{
    const on=fav.classList.toggle('on');
    fav.querySelector('.heart').textContent = on?'♥':'♡';
    fav.querySelector('.lab').textContent = on?'Favorited':'Favorite';
  };
  return el;
}

function render(){
  const q=(qEl.value||'').toLowerCase();
  const list=fridges.filter(it=>{
    const p=it.product||{};
    return ((p.name||it.name)+' '+(p.color||'')).toLowerCase().includes(q);
  });
  countEl.textContent = list.length+' fridge'+(list.length===1?'':'s');
  grid.innerHTML='';
  list.forEach(it=>grid.appendChild(card(it)));
}

qEl.oninput=render;

(async function(){
  try{
    const cat=await (await fetch('/api/catalog')).json();
    fridges=cat.items.filter(i=>i.category==='Fridges');
    render();
  }catch(e){
    grid.innerHTML='<div style="color:#3A4055">Could not load catalog. Is the admin server running?</div>';
  }
  setTimeout(()=>document.getElementById('splash').classList.add('hide'),500);
})();
</script>
</body>
</html>
